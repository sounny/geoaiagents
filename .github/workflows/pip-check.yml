name: Pip Check

on: [pull_request]

jobs:
  pip-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies and run pip check
      run: |
        pip install -r requirements.txt
        pip check
